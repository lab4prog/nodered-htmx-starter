<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodeRed + HTMX</title>
    <!-- history restore must request the full page, not an HTMX fragment -->
    <meta name="htmx-config" content='{"historyRestoreAsHxRequest": false}'>
    <link rel="stylesheet" href="/assets/style.css">
</head>

<body hx-indicator="#indicator">

    <nav>
        <li>
            <a href="/" hx-get="/" hx-target="#main" hx-push-url="true">
                Home
            </a>
            <a href="/pages/todo" hx-get="/pages/todo" hx-target="#main" hx-push-url="true">
                ToDo
            </a>
            <a href="/pages/contacts" hx-get="/pages/contacts" hx-target="#main" hx-push-url="true">
                Contacts
            </a>
        </li>
    </nav>

    <main id="main">
        <slot/>
    </main>
    
    <!-- LOADER -->
    <div id="indicator" class="htmx-indicator">
        <div class="spinner" role="status" aria-label="Loading"></div>
    </div>
    <!-- END LOADER -->

    <!-- NOTIFICATION -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 5000;" id="toastPlacement"></div>

    <template id="toast-template-success">
        <div class="toast align-items-center text-white bg-success border-0 mb-2" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center">
                    <i class="ti ti-check me-2 fs-3"></i>
                    <div class="toast-text"></div>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </template>

    <template id="toast-template-error">
        <div class="toast align-items-center text-white bg-danger border-0 mb-2" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center">
                    <i class="ti ti-alert-triangle me-2 fs-3"></i>
                    <div class="toast-text"></div>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </template>

    <template id="toast-template-info">
        <div class="toast align-items-center text-white bg-primary border-0 mb-2" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center">
                    <i class="ti ti-info-circle me-2 fs-3"></i>
                    <div class="toast-text"></div>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </template>
    <!-- END NOTIFICATION-->

    <!-- MODAL -->
    <div class="modal" id="Modal" tabindex="-1">
        <div class="modal-dialog" role="document">
            <div class="modal-content" id="ModalContent">
            </div>
        </div>
    </div>
    <!-- END MODAL -->

    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.min.js"
        integrity="sha384-ZBXiYtYQ6hJ2Y0ZNoYuI+Nq5MqWBr+chMrS/RkXpNzQCApHEhOt2aY8EJgqwHLkJ"
        crossorigin="anonymous"></script>
    <script src="/assets/main.js"></script>
</body>

</html>
