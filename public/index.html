<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node-RED + HTMX</title>
    <!-- history restore must request the full page, not an HTMX fragment -->
    <meta name="htmx-config" content='{"historyRestoreAsHxRequest": false}'>
    <link rel="stylesheet" href="/assets/style.css">
</head>

<body hx-indicator="#indicator">

    <nav>
        <a href="/" hx-get="/" hx-target="#main" hx-push-url="true">Home</a>
        <a href="/pages/todo" hx-get="/pages/todo" hx-target="#main" hx-push-url="true">ToDo</a>
        <a href="/pages/contacts" hx-get="/pages/contacts" hx-target="#main" hx-push-url="true">Contacts</a>
    </nav>

    <main id="main">
        <slot/>
    </main>
    
    <!-- LOADER -->
    <div id="indicator" class="htmx-indicator">
        <div class="spinner" role="status" aria-label="Loading"></div>
    </div>
    <!-- END LOADER -->

    <!-- NOTIFICATION (main.js: showToast) -->
    <div id="toastPlacement" class="toast-container"></div>

    <template id="toast-template-success">
        <div class="toast toast-success" role="alert" aria-live="assertive" aria-atomic="true">
            <span class="toast-icon" aria-hidden="true">&#10003;</span>
            <div class="toast-text"></div>
            <button type="button" class="toast-close" aria-label="Close"></button>
        </div>
    </template>

    <template id="toast-template-error">
        <div class="toast toast-error" role="alert" aria-live="assertive" aria-atomic="true">
            <span class="toast-icon" aria-hidden="true">&#9888;</span>
            <div class="toast-text"></div>
            <button type="button" class="toast-close" aria-label="Close"></button>
        </div>
    </template>

    <template id="toast-template-info">
        <div class="toast toast-info" role="alert" aria-live="assertive" aria-atomic="true">
            <span class="toast-icon" aria-hidden="true">&#8505;</span>
            <div class="toast-text"></div>
            <button type="button" class="toast-close" aria-label="Close"></button>
        </div>
    </template>
    <!-- END NOTIFICATION-->

    <!-- MODAL -->
    <div class="modal" id="Modal" tabindex="-1">
        <div class="modal-dialog" role="document">
            <div class="modal-content" id="ModalContent">
            </div>
        </div>
    </div>
    <!-- END MODAL -->

    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.min.js"
        integrity="sha384-ZBXiYtYQ6hJ2Y0ZNoYuI+Nq5MqWBr+chMrS/RkXpNzQCApHEhOt2aY8EJgqwHLkJ"
        crossorigin="anonymous"></script>
    <script src="/assets/main.js"></script>
</body>

</html>
