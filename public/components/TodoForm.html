{{! create: no form.id -> POST /todos, edit: form.id -> PUT /todos/:id. A 422 from the Validate subflow re-renders this form with msg.errors }}
<form {{#form.id}}hx-put="/todos/{{form.id}}"{{/form.id}}{{^form.id}}hx-post="/todos"{{/form.id}}
    hx-target="#todo-list" hx-swap="outerHTML">
    <h2>{{#form.id}}Edit task{{/form.id}}{{^form.id}}New task{{/form.id}}</h2>
    <input name="title" value="{{form.title}}" placeholder="Title" autofocus
        class="{{#errors.title}}invalid{{/errors.title}}">
    {{#errors.title}}<div class="field-error">{{errors.title}}</div>{{/errors.title}}
    <div class="actions">
        <button type="button" data-modal-close>Cancel</button>
        <button type="submit">Save</button>
    </div>
</form>
